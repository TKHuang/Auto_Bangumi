# Development Docker Compose
# Launch via `make dev` (never invoke this file directly).
#
# Services:
#   backend: http://localhost:7893 (FastAPI, hot reload via uvicorn --reload)
#   webui:   http://localhost:5173 (Vite dev server)
#
# Downloader settings (PikPak or qBittorrent) live in
# ./dev-config/backend/config_dev.json, not in env vars here.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev.backend
    container_name: ab-backend-dev
    restart: unless-stopped
    networks:
      - ab-dev-network
    ports:
      - "7893:7893"
    environment:
      - TZ=Asia/Taipei
      - AB_DEV_MODE=true
      # Pin backend root for alembic lookup inside the container; keeps
      # migrate.py from walking up to "/" when src is mounted as /app.
      - AB_BACKEND_DIR=/app
    volumes:
      # Source code with live reload
      - ./backend/src:/app:cached
      # Alembic migration scripts (read-only; backend only reads them)
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
      # Persistent config (JSON), SQLite data, downloads cache
      - ./dev-config/backend:/app/config
      - ./dev-config/data:/app/data
      - ./dev-config/downloads:/downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7893/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  webui:
    build:
      context: .
      dockerfile: Dockerfile.dev.webui
    container_name: ab-webui-dev
    restart: unless-stopped
    networks:
      - ab-dev-network
    ports:
      - "5173:5173"
    environment:
      - TZ=Asia/Taipei
    volumes:
      - ./webui:/app:cached
      - webui_node_modules:/app/node_modules
    depends_on:
      - backend

networks:
  ab-dev-network:
    driver: bridge

volumes:
  webui_node_modules:
