version: "3.4"

services:
  AutoBangumi:
    image: "ghcr.io/estrellaxd/auto_bangumi:latest"
    container_name: AutoBangumi
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    ports:
      - "7892:7892"
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - PGID=1000
      - PUID=1000
      - UMASK=022

  rclone:
    image: rclone/rclone:latest
    container_name: ab-rclone
    entrypoint: /scripts/rclone-entrypoint.sh
    depends_on:
      - AutoBangumi
    environment:
      - TZ=Asia/Shanghai
      - AB_ENV=prod
      # VFS Cache Settings (adjust as needed)
      - RCLONE_CACHE_MAX_SIZE=10G
      - RCLONE_CACHE_MAX_AGE=1h
    volumes:
      # Shared config with AutoBangumi (read-only)
      - ./config:/config:ro
      # Entrypoint script
      - ./scripts:/scripts:ro
      # Mount point for PikPak files (change left side to your preferred path)
      - /mnt/external/bangumi:/mnt/pikpak:shared
      # VFS cache location (change left side to your preferred path)
      - /mnt/external/rclone-cache:/cache
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    restart: unless-stopped
