[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "module"
version = "4.0.0"
description = "Auto Bangumi - Automatic anime download and management"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "EstrellaXD", email = "estrellaxd@outlook.com"},
]
keywords = ["anime", "bangumi", "rss", "downloader"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "sqlmodel>=0.0.14",
    "aiosqlite>=0.20",
    "apscheduler>=4.0.0a6",
    "httpx>=0.28",
    "pikpakapi>=0.1",
    "qbittorrent-api>=2024.12",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.0",
    "structlog>=24.0",
    "python-statemachine>=2.0",
    "Pillow>=11.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "httpx",
]

[project.urls]
Homepage = "https://www.autobangumi.org"
Documentation = "https://www.autobangumi.org"
Repository = "https://github.com/EstrellaXD/Auto_Bangumi"
Issues = "https://github.com/EstrellaXD/Auto_Bangumi/issues"

[tool.setuptools]
packages = ["module"]
package-dir = {"" = "src"}

[tool.ruff]
select = [
    "E",
    "F",
    "I"
]
ignore = [
    "E501",
    "F401",
]
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]
unfixable = []
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
per-file-ignores = {}
line-length = 88
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
target-version = "py310"

[tool.ruff.mccabe]
max-complexity = 10

[tool.black]
line-length = 88
target-version = ["py310", "py311"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests spanning multiple components",
    "e2e: End-to-end tests for complete user workflows",
    "slow: Tests that are slow to execute (performance benchmarks)",
    "edge_case: Tests for edge cases and boundary conditions",
]
