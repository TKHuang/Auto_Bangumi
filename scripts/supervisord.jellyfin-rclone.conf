[unix_http_server]
file=/run/supervisor.sock

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:rclone]
command=/usr/local/bin/rclone-mount.sh
autostart=true
autorestart=true
startsecs=5
startretries=999
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=10
stopwaitsecs=10
stopsignal=TERM

[program:jellyfin]
command=/usr/local/bin/jellyfin-start.sh
autostart=true
autorestart=true
startsecs=10
startretries=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=20
stopwaitsecs=15
stopsignal=TERM
