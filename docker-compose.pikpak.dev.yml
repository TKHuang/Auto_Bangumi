# PikPak Development Docker Compose
# Use with the main dev compose: docker compose -f docker-compose.dev.yml -f docker-compose.pikpak.dev.yml up
#
# Or standalone for rclone only: docker compose -f docker-compose.pikpak.dev.yml up
#
# Services:
#   - rclone: Mounts PikPak cloud storage to ./dev-config/pikpak
#
# Prerequisites:
#   - Configure PikPak credentials in dev-config/backend/config_dev.json
#   - Set downloader.type = "pikpak", downloader.path = "AB" (or your folder)

services:
  # ============================================
  # Rclone - PikPak Cloud Storage Mount
  # ============================================
  rclone:
    image: rclone/rclone:latest
    container_name: ab-rclone-dev
    entrypoint: /scripts/rclone-entrypoint.sh
    restart: unless-stopped
    networks:
      - ab-dev-network
    environment:
      - TZ=Asia/Taipei
      - AB_ENV=dev
      # VFS Cache Settings
      - RCLONE_CACHE_MAX_SIZE=5G
      - RCLONE_CACHE_MAX_AGE=30m
    volumes:
      # Shared config with backend - reads config_dev.json
      - ./dev-config/backend:/config:ro
      # Entrypoint script
      - ./scripts:/scripts:ro
      # Mount point for PikPak files (visible on host)
      - ./dev-config/pikpak:/mnt/pikpak:shared
      # VFS cache location
      - ./dev-config/rclone-cache:/cache
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined

networks:
  ab-dev-network:
    driver: bridge
