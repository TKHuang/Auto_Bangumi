services:
  backend:
    build: ./backend
    container_name: zen-bangumi-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      # Downloader configuration
      - ZEN_DOWNLOADER_HOST=${DOWNLOADER_HOST:-http://localhost:8080}
      - ZEN_DOWNLOADER_USERNAME=${DOWNLOADER_USERNAME:-admin}
      - ZEN_DOWNLOADER_PASSWORD=${DOWNLOADER_PASSWORD:-adminadmin}
      # Database configuration
      - ZEN_DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///data/zen_bangumi.db}
      # Security
      - ZEN_SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ZEN_CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:7892}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build: ./frontend
    container_name: zen-bangumi-frontend
    ports:
      - "7892:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=${API_URL:-http://localhost:8000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  data:
  config:
