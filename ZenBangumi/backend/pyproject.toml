[project]
name = "zen-bangumi"
version = "0.1.0"
description = "Zen Bangumi - Automated anime management system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "apscheduler>=4.0.0a6",
  "httpx>=0.28",
  "pikpakapi>=0.1",
  "qbittorrent-api>=2024.12",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "feedparser>=6.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "Pillow>=11.0",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "httpx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["src/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
